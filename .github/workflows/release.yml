# Builds the Play release (an .aab for upload, plus an .apk), signed with the upload key from
# repository secrets. Run it from the Actions tab, or push a tag like v1.0.0. See RELEASING.md.
name: Release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the upload key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set. See RELEASING.md."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.p12"

      - name: Test and build
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: bash gradlew testDebugUnitTest bundleRelease assembleRelease

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: manage-everything-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
